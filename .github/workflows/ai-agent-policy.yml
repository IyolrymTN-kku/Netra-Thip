name: AI Agent Policy Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  ai-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Security Rules Present
        run: |
          if [ ! -f ".ai/security-rules.md" ]; then
            echo "Missing .ai/security-rules.md"
            exit 1
          fi
          echo "AI Security Rules verified."
