name: CI Quality Gate

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm i -g pnpm && pnpm install
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Test
        run: pnpm test
        continue-on-error: true
      - name: Build
        run: pnpm build
        continue-on-error: true
